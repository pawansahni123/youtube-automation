name: YouTube Short-Only Pipeline

on:
  schedule:
    - cron: '30 5 * * *'   # 11:00 AM IST
    - cron: '30 12 * * *'  # 6:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-publishing
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore secrets and credentials
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "NICHE_KEYWORDS=${{ secrets.NICHE_KEYWORDS }}" >> .env
          echo "REGION_CODE=US" >> .env
          echo "${{ secrets.CLIENT_SECRET_JSON_B64 }}" | base64 -d > client_secret.json
          echo "${{ secrets.TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle
          echo "${{ secrets.TOKEN_ANALYTICS_PICKLE_B64 }}" | base64 -d > token_analytics.pickle
          echo "UPLOAD_PRIVACY_STATUS=${{ secrets.UPLOAD_PRIVACY_STATUS }}" >> .env

      - name: Run short-only pipeline
        run: |
          python agents/topic_agent.py
          python agents/research_agent.py
          python agents/script_agent.py short
          python agents/voice_agent.py
          python agents/media_agent.py
          python agents/editor_agent.py
          python agents/qa_agent.py
          python agents/thumbnail_agent.py
          python agents/seo_agent.py
          python agents/upload_agent.py

      - name: Preserve run history for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-run-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            database/uploads.json
            database/topics.json
            database/research.json
            database/scripts.json
            database/media.json
            database/seo.json
            database/qa_reports.json
          retention-days: 30

      - name: Save run history back to repo
        if: always()
        run: |
          git config user.name "YouTube Automation Bot"
          git config user.email "actions@github.com"
          for file in database/{uploads,topics,research,scripts,media,seo,qa_reports}.json; do
            if [ -f "$file" ]; then git add -f -- "$file"; fi
          done
          git diff --staged --quiet || git commit -m "Log new upload [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
